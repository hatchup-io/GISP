[project]
name = "gisp"
version = "0.1.1"
description = "Google Integration Service Proxy - client for Google-integration backend calendar events API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["google_integration_proxy"]