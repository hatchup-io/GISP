[project]
name = "gisp"
version = "0.3.0"
description = "Google Integration Service Proxy - client for Google-integration backend calendar events API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "HatchUp", url = "https://hatchup.capital" },
]
keywords = ["google-integration", "calendar", "api-client", "hatchup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Match the backend's pinned rule set so an unpinned ruff release cannot change
# what CI enforces.
select = ["E4", "E7", "E9", "F"]

[project.urls]
Repository = "https://github.com/hatchup-io/GISP"
Documentation = "https://github.com/hatchup-io/GISP#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["google_integration_proxy"]
