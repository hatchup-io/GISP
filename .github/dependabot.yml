version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    ignore:
      # The library declares httpx<1 for its consumers; a 1.x move is a
      # deliberate API change, not a bot update.
      - dependency-name: "httpx"
        update-types: ["version-update:semver-major"]
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
