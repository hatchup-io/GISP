---
name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        # Never run a fork's pull request on our own runner: that is arbitrary
        # code on our machine.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.13'
            - run: uv sync --all-groups
            - run: uv run ruff check .
            - run: uv run ruff format --check .

    test:
        # Never run a fork's pull request on our own runner: that is arbitrary
        # code on our machine.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: self-hosted
        strategy:
            matrix:
                # The package declares requires-python >=3.12; test both so a 3.12-only
                # deployment cannot be broken by 3.13-only syntax.
                python-version: ['3.12', '3.13']
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: ${{ matrix.python-version }}
            - run: uv sync --all-groups
            # No network: every test runs against httpx.MockTransport.
            - run: uv run pytest -v

    build:
        needs: [lint, test]
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  python-version: '3.13'
            # Proves the package still builds and installs as a consumer would get it,
            # and that the public API imports from the built artifact rather than the
            # source tree.
            - run: uv build
            - name: Import the built wheel in a clean environment
              run: |
                  # The job's own temp dir: /tmp is shared by every runner on the host.
                  venv="$RUNNER_TEMP/gisp-check"
                  uv venv "$venv"
                  VIRTUAL_ENV="$venv" uv pip install dist/*.whl
                  "$venv/bin/python" -c "
                  import google_integration_proxy as g
                  required = {
                      'GoogleIntegrationClient', 'GoogleIntegrationAccountError',
                      'GoogleIntegrationNotFoundError', 'GoogleIntegrationAuthError',
                  }
                  missing = required - set(g.__all__)
                  assert not missing, f'missing exports: {missing}'
                  print('public API present:', len(g.__all__), 'exports')
                  "
